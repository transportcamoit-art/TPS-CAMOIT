<!DOCTYPE html>
<html lang="fr">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
  >

  <title>Saisie Journalière</title>


  <!-- PWA standard (Android / Chrome) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">


  <!-- Spécifique iOS : c'est ce qui permet un vrai lancement
       plein écran depuis l'écran d'accueil sur iPhone. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Saisie">
  <link rel="apple-touch-icon" href="icon-192.png">


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      overflow-x: hidden;

      background: #f1f5f9;
    }


    #cadre-app {

      display: block;

      width: 100%;

      border: none;

      /* Hauteur de secours affichée un court instant avant
         réception du premier message de l'appli. */
      height: 900px;

      transition: height 0.15s ease;
    }

  </style>

</head>


<body>


  <!--
    IMPORTANT : remplace l'URL ci-dessous par celle de ton
    déploiement Apps Script (celle qui se termine par /exec).
  -->

  <iframe
    id="cadre-app"
    src="https://script.google.com/macros/s/AKfycbzQJlVLwnNOy1pazwogIJ_4sIm7GGIv2ff-hWTZCUwSeKSFniO7G6-mC2hukf-wLGjL/exec"
    title="Saisie Journalière"
    scrolling="no">
  </iframe>


  <script>

    var cadre =
      document.getElementById("cadre-app");


    window.addEventListener("message", function(event) {

      var donnees =
        event.data;


      if (
        donnees &&
        donnees.type === "app-hauteur" &&
        typeof donnees.hauteur === "number" &&
        donnees.hauteur > 0
      ) {

        // Petite marge de sécurité pour éviter toute coupure.
        cadre.style.height =
          (donnees.hauteur + 20) + "px";
      }

    });


    // Enregistrement du service worker : condition nécessaire
    // pour que le navigateur propose "Ajouter à l'écran
    // d'accueil" comme une vraie appli installable.
    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function() {

        navigator.serviceWorker
          .register("sw.js")
          .catch(function(erreur) {

            console.error(
              "Échec de l'enregistrement du service worker :",
              erreur
            );
          });
      });
    }

  </script>


</body>
</html>
