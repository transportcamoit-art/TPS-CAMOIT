<!DOCTYPE html>
<html lang="fr">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
  >

  <title>Saisie Journalière</title>


  <!-- PWA standard (Android / Chrome) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">


  <!-- Spécifique iOS : c'est ce qui permet un vrai lancement
       plein écran depuis l'écran d'accueil sur iPhone. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Saisie">
  <link rel="apple-touch-icon" href="icon-192.png">


  <style>

    * {
      box-sizing: border-box;
    }

    /*
     * La page GitHub ne défile JAMAIS : elle fait exactement la
     * taille de l'écran. C'est l'application, à l'intérieur du
     * cadre, qui gère son propre défilement (une seule barre).
     */

    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background: #f1f5f9;
    }


    /*
     * Le cadre occupe tout l'écran.
     * 100vh = secours pour les anciens navigateurs,
     * 100dvh = hauteur réelle visible (barre d'adresse mobile
     * prise en compte).
     */

    #cadre-app {

      display: block;

      width: 100%;

      height: 100vh;

      height: 100dvh;

      border: none;
    }

  </style>

</head>


<body>


  <!--
    IMPORTANT : remplace l'URL ci-dessous par celle de ton
    déploiement Apps Script (celle qui se termine par /exec).
  -->

  <iframe
    id="cadre-app"
    src="https://script.google.com/macros/s/AKfycbzQJlVLwnNOy1pazwogIJ_4sIm7GGIv2ff-hWTZCUwSeKSFniO7G6-mC2hukf-wLGjL/exec"
    title="Saisie Journalière"
    scrolling="no">
  </iframe>


  <script>

    // Enregistrement du service worker : condition nécessaire
    // pour que le navigateur propose "Ajouter à l'écran
    // d'accueil" comme une vraie appli installable.
    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function() {

        navigator.serviceWorker
          .register("sw.js")
          .catch(function(erreur) {

            console.error(
              "Échec de l'enregistrement du service worker :",
              erreur
            );
          });
      });
    }

  </script>


</body>
</html>
