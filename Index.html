<!DOCTYPE html>
<html lang="fr">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Saisie Journalière</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      overflow-x: hidden;

      background: #f1f5f9;
    }


    #cadre-app {

      display: block;

      width: 100%;

      border: none;

      /* Hauteur de secours affichée un court instant avant
         réception du premier message de l'appli. */
      height: 900px;

      transition: height 0.15s ease;
    }

  </style>

</head>


<body>


  <!--
    IMPORTANT : remplace l'URL ci-dessous par celle de ton
    déploiement Apps Script (celle qui se termine par /exec).
  -->

  <iframe
    id="cadre-app"
    src="REMPLACE_PAR_TON_URL_EXEC"
    title="Saisie Journalière"
    scrolling="no">
  </iframe>


  <script>

    var cadre =
      document.getElementById("cadre-app");


    window.addEventListener("message", function(event) {

      var donnees =
        event.data;


      if (
        donnees &&
        donnees.type === "app-hauteur" &&
        typeof donnees.hauteur === "number" &&
        donnees.hauteur > 0
      ) {

        // Petite marge de sécurité pour éviter toute coupure.
        cadre.style.height =
          (donnees.hauteur + 20) + "px";
      }

    });

  </script>


</body>
</html>
